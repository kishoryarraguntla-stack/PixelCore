<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelCore Admin</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f7fb;
  color:#15161a;
}
.wrap{max-width:900px;margin:auto;padding:40px 20px}
.top h1{font-size:56px;margin:0 0 8px;letter-spacing:-2px}
.top p{font-size:22px;color:#5f6368;margin:0 0 35px}
.card{
  background:#fff;
  border:1px solid #dddfe3;
  border-radius:28px;
  padding:34px;
  box-shadow:0 10px 35px rgba(0,0,0,.05);
}
.login h2{font-size:34px;margin:0 0 25px}
label{display:block;font-weight:600;margin:18px 0 8px}
input{
  width:100%;padding:15px 16px;border:1px solid #d5d7dc;
  border-radius:14px;font-size:16px;outline:none;
}
input:focus{border-color:#111}
button{
  width:100%;padding:15px;border:0;border-radius:14px;
  background:#111;color:#fff;font-size:17px;font-weight:700;
  cursor:pointer;margin-top:22px;
}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.error{
  display:none;margin-top:16px;padding:12px 14px;border-radius:12px;
  background:#fff0f0;color:#b00020;font-size:14px;
}
.dashboard{display:none}
.welcome{font-size:38px;margin:0 0 14px}
.success{font-size:19px;color:#555;margin-bottom:25px}
.info{
  border:1px solid #dddfe3;border-radius:20px;padding:24px;margin:16px 0
}
.info h3{margin:0 0 12px;font-size:23px}
.info p{margin:0;font-size:18px;word-break:break-word}
.logout{background:#fff;color:#111;border:1px solid #d5d7dc}
.note{font-size:13px;color:#777;margin-top:18px;line-height:1.5}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>Admin</h1>
    <p>Manage your website.</p>
  </div>

  <section id="loginCard" class="card login">
    <h2>Welcome to PixelCore Admin</h2>

    <label for="userId">User ID</label>
    <input id="userId" type="text" placeholder="Admin" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">

    <button id="loginBtn">Login</button>
    <div id="errorBox" class="error"></div>

    <div class="note">
      Admin access is protected by Firebase Authentication.
    </div>
  </section>

  <section id="dashboard" class="card dashboard">
    <h2 class="welcome">Welcome to PixelCore Admin</h2>
    <p class="success">You are successfully logged in.</p>

    <div class="info">
      <h3>Website</h3>
      <p>PixelCore.in</p>
    </div>

    <div class="info">
      <h3>Admin Account</h3>
      <p id="adminEmail"></p>
    </div>

    <button id="logoutBtn" class="logout">Logout</button>
  </section>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTINT8mINL77NOaxZ1iiTbbNn-bfCiglg",
  authDomain: "pixelcore-ecc7e.firebaseapp.com",
  projectId: "pixelcore-ecc7e",
  storageBucket: "pixelcore-ecc7e.firebasestorage.app",
  messagingSenderId: "930829405457",
  appId: "1:930829405457:web:1635d5328d2f877eaf50b0",
  measurementId: "G-LBBGKBJ1PY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const ADMIN_EMAIL = "kishor.yarraguntla@gmail.com";

const loginCard = document.getElementById("loginCard");
const dashboard = document.getElementById("dashboard");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userId = document.getElementById("userId");
const password = document.getElementById("password");
const errorBox = document.getElementById("errorBox");
const adminEmail = document.getElementById("adminEmail");

function showError(message){
  errorBox.textContent = message;
  errorBox.style.display = "block";
}

loginBtn.addEventListener("click", async () => {
  errorBox.style.display = "none";

  const enteredUserId = userId.value.trim();
  const pass = password.value;

  if(enteredUserId.toLowerCase() !== "admin"){
    showError("Invalid User ID.");
    return;
  }

  if(!pass){
    showError("Please enter your password.");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try{
    await signInWithEmailAndPassword(auth, ADMIN_EMAIL, pass);
  }catch(error){
    let message = "Login failed. Please check your password.";

    if(error.code === "auth/invalid-credential" ||
       error.code === "auth/wrong-password"){
      message = "Incorrect password.";
    }else if(error.code === "auth/invalid-api-key"){
      message = "Firebase API key is invalid. Please verify the Firebase configuration.";
    }else if(error.code === "auth/unauthorized-domain"){
      message = "This domain is not authorized in Firebase Authentication.";
    }else if(error.code === "auth/too-many-requests"){
      message = "Too many login attempts. Please try again later.";
    }

    showError(message);
  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
});

onAuthStateChanged(auth, (user) => {
  if(user && user.email === ADMIN_EMAIL){
    loginCard.style.display = "none";
    dashboard.style.display = "block";
    adminEmail.textContent = user.email;
  }else{
    loginCard.style.display = "block";
    dashboard.style.display = "none";
  }
});
</script>

</body>
</html>
