<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelCore Admin CMS</title>
<style>
:root{--p:#6d35ff;--s:#10b981;--pink:#ec4899;--orange:#ff7a18;--navy:#101b3d;--bg:#f4f7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}
.sidebar{width:245px;background:linear-gradient(180deg,#101b3d 0%,#192d5d 70%,#263b72 100%);color:#fff;padding:18px 14px;position:fixed;left:0;top:0;bottom:0;z-index:20}
.brand{font-size:22px;font-weight:900;padding:8px 10px 23px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:2px}
.nav a{display:flex;gap:12px;align-items:center;padding:12px 13px;border-radius:11px;color:#dbe4ff;text-decoration:none;margin:4px 0;font-size:14px;font-weight:700}.nav a.active,.nav a:hover{background:linear-gradient(90deg,#7c3aed,#12b9d4);color:#fff}
.sidebarBottom{position:absolute;left:14px;right:14px;bottom:18px;background:linear-gradient(135deg,#6538d7aa,#1fb8c766);border:1px solid #ffffff22;border-radius:14px;padding:14px;font-size:12px;line-height:1.5}
.main{margin-left:245px;width:calc(100% - 245px)}.top{height:72px;background:linear-gradient(100deg,#7437ff,#2d83f3,#10b8c5);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10;box-shadow:0 6px 20px #24335a22}.top h1{font-size:18px;margin:0}.topRight{display:flex;gap:10px;align-items:center}.top button{border:0;border-radius:10px;padding:10px 14px;font-weight:800}.view{background:#243e91;color:#fff}.logout{background:#fff;color:#d13a66}
.content{padding:24px;max-width:1250px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.stat{border-radius:16px;color:#fff;padding:20px;min-height:112px;box-shadow:0 10px 25px #17203316}.stat:nth-child(1){background:linear-gradient(135deg,#287cff,#3d9cff)}.stat:nth-child(2){background:linear-gradient(135deg,#08b77d,#35d99a)}.stat:nth-child(3){background:linear-gradient(135deg,#ff7b20,#ff4e46)}.stat:nth-child(4){background:linear-gradient(135deg,#ef2ca7,#a738e8)}.stat b{font-size:28px;display:block}.stat span{font-size:13px;font-weight:800}
.panel{background:#fff;border:1px solid #e3e8f1;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 7px 26px #1720330c}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h2{font-size:19px;margin:0}.sub{font-size:12px;color:#758096;margin-top:3px}
label{display:block;font-size:12px;font-weight:800;margin:11px 0 6px}input,textarea{width:100%;border:1px solid #d8deea;border-radius:9px;padding:10px 11px;outline:none;background:#fff}input:focus,textarea:focus{border-color:#7040ff;box-shadow:0 0 0 3px #7040ff18}textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.save{background:linear-gradient(90deg,#7137ff,#08b9c8);color:#fff;border:0;border-radius:11px;padding:12px 20px;font-weight:850;box-shadow:0 8px 18px #7137ff35}.item{border:1px solid #e6eaf2;border-radius:14px;padding:15px;background:#fbfcff}.item h3{font-size:14px;margin:0 0 8px}
.colourGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.colour{display:flex;gap:9px;align-items:center}.colour input[type=color]{width:45px;height:40px;padding:3px;border-radius:8px}
.project{display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:start}.preview{height:105px;border-radius:11px;background:#eef1f7;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#8b95a7;font-size:12px}.preview img{width:100%;height:100%;object-fit:cover}.uploadBtn{display:inline-block;background:#eeeaff;color:#5b35dd;padding:9px 12px;border-radius:8px;font-weight:800;font-size:12px;margin-top:8px;cursor:pointer}input[type=file]{display:none}
.modalBg{position:fixed;inset:0;background:#10182d8c;display:none;align-items:center;justify-content:center;z-index:100}.modal{width:min(390px,90vw);background:#fff;border-radius:22px;padding:28px;text-align:center;box-shadow:0 25px 80px #0005;position:relative}.check{width:68px;height:68px;border-radius:50%;background:#27b978;color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 12px}.modal h2{font-size:28px;margin:0 0 7px}.modal p{color:#606a7c;margin:0 0 20px}.ok{background:linear-gradient(90deg,#7137ff,#08b8c8);color:#fff;border:0;border-radius:10px;padding:11px 42px;font-weight:850}.close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:23px;color:#697386}
#login{display:none;position:fixed;inset:0;background:linear-gradient(135deg,#101b3d,#6d35ff,#11b8c9);align-items:center;justify-content:center;z-index:200}.loginCard{background:#fff;width:min(390px,92vw);padding:28px;border-radius:20px;box-shadow:0 30px 90px #0005}.loginLogo{font-size:25px;font-weight:900;text-align:center;margin-bottom:4px}.loginSub{text-align:center;color:#7a8494;font-size:13px;margin-bottom:20px}.loginBtn{width:100%;margin-top:15px;background:linear-gradient(90deg,#7137ff,#09b8c8);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:850}.forgot{display:block;text-align:right;margin-top:9px;color:#5d39db;font-size:12px;font-weight:750;cursor:pointer}#loginMsg{font-size:12px;color:#d23d58;margin-top:10px}
@media(max-width:900px){.sidebar{width:74px}.brand{font-size:0;text-align:center}.brand small,.nav span,.sidebarBottom{display:none}.nav a{justify-content:center;font-size:18px}.main{margin-left:74px;width:calc(100% - 74px)}.stats{grid-template-columns:repeat(2,1fr)}.colourGrid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.top{padding:0 15px}.content{padding:14px}.stats,.grid2,.grid3,.colourGrid{grid-template-columns:1fr}.project{grid-template-columns:1fr}.top h1{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>PixelCore Admin</h1><div class="muted" id="account">Checking login…</div></div><div class="top-actions"><button class="secondary" id="logout">Logout</button></div></header>
<div id="status"></div>
<div id="loginPanel" class="panel" style="display:none"><h2>Admin Login</h2><label>Email</label><input id="loginEmail" type="email" value="kishor.yarraguntla@gmail.com"><label>Password</label><input id="loginPassword" type="password"><button class="primary" id="loginBtn" style="margin-top:14px">Login</button><p class="muted" id="loginError"></p></div>
<main id="cms" style="display:none">
<div class="panel"><h2>Home / Hero</h2>
<label>Badge</label><input id="heroBadge">
<label>Heading</label><input id="heroTitle">
<label>Description</label><textarea id="heroText"></textarea>
<label>Trust text</label><input id="trustText">
</div>

<div class="panel"><h2>Services</h2><div id="services"></div></div>
<div class="panel"><h2>Concept Demos</h2><div id="projects"></div></div>
<div class="panel"><h2>Pricing</h2><div id="pricing"></div></div>

<div class="panel"><h2>Contact</h2>
<div class="row"><div><label>Eyebrow</label><input id="contactEyebrow"></div><div><label>Email</label><input id="contactEmail" type="email"></div></div>
<label>Heading</label><input id="contactTitle"><label>Description</label><textarea id="contactText"></textarea>
</div>
<button class="primary" id="save" style="width:100%;font-size:16px">Save Changes</button>
</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTINT8mINL77NOaxZ1iiTbbNn-bfCiglg",
  authDomain: "pixelcore-ecc7e.firebaseapp.com",
  projectId: "pixelcore-ecc7e",
  storageBucket: "pixelcore-ecc7e.firebasestorage.app",
  messagingSenderId: "930829405457",
  appId: "1:930829405457:web:1635d5328d2f877eaf50b0",
  measurementId: "G-LBBGKBJ1PY"
};

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const ADMIN_EMAIL="kishor.yarraguntla@gmail.com";
const defaults={
heroBadge:"WEB DESIGN • PIXEL PERFECT",heroTitle:"Websites that make your business stand out.",heroText:"Modern, responsive websites designed to look premium, feel effortless and help your business make a stronger first impression.",trustText:"Clean design · Mobile first · Fast experience",
services:[{title:"Business Websites",desc:"Professional websites that establish trust and present your business clearly."},{title:"Portfolio Websites",desc:"Clean personal-brand websites for creators, professionals and freelancers."},{title:"Online Stores",desc:"Modern storefront concepts designed for a smooth shopping experience."}],
projects:[{title:"Business Website",desc:"Professional company landing concept.",image:""},{title:"Portfolio Website",desc:"Minimal personal brand concept.",image:""},{title:"Online Store",desc:"Clean e-commerce homepage concept.",image:""}],
pricing:[{name:"Basic",price:"₹999",desc:"A clean starter website for individuals and small businesses."},{name:"Startup",price:"₹2,999",desc:"A stronger web presence for growing businesses."},{name:"Premium",price:"₹5,999",desc:"A polished custom experience for brands that want more."}],
contact:{eyebrow:"Let's build",title:"Ready to create your website?",text:"Tell us what you need and let's turn your idea into a clean, modern website.",email:"hello@pixelcore.in"}
};
const $=id=>document.getElementById(id);
function fill(c){
$("heroBadge").value=c.heroBadge||"";$("heroTitle").value=c.heroTitle||"";$("heroText").value=c.heroText||"";$("trustText").value=c.trustText||"";
$("services").innerHTML=(c.services||[]).map((s,i)=>`<div class="item"><b>Service ${i+1}</b><label>Title</label><input data-service-title="${i}"><label>Description</label><textarea data-service-desc="${i}"></textarea></div>`).join("");
(c.services||[]).forEach((s,i)=>{document.querySelector(`[data-service-title="${i}"]`).value=s.title||"";document.querySelector(`[data-service-desc="${i}"]`).value=s.desc||""});
$("projects").innerHTML=(c.projects||[]).map((p,i)=>`<div class="item"><b>Demo ${i+1}</b><label>Title</label><input data-project-title="${i}"><label>Description</label><textarea data-project-desc="${i}"></textarea><label>Image URL (optional)</label><input data-project-image="${i}" placeholder="https://..."></div>`).join("");
(c.projects||[]).forEach((p,i)=>{document.querySelector(`[data-project-title="${i}"]`).value=p.title||"";document.querySelector(`[data-project-desc="${i}"]`).value=p.desc||"";document.querySelector(`[data-project-image="${i}"]`).value=p.image||""});
$("pricing").innerHTML=(c.pricing||[]).map((p,i)=>`<div class="item"><b>Plan ${i+1}</b><div class="row"><div><label>Name</label><input data-price-name="${i}"></div><div><label>Price</label><input data-price-value="${i}"></div></div><label>Description</label><textarea data-price-desc="${i}"></textarea></div>`).join("");
(c.pricing||[]).forEach((p,i)=>{document.querySelector(`[data-price-name="${i}"]`).value=p.name||"";document.querySelector(`[data-price-value="${i}"]`).value=p.price||"";document.querySelector(`[data-price-desc="${i}"]`).value=p.desc||""});
$("contactEyebrow").value=c.contact?.eyebrow||"";$("contactTitle").value=c.contact?.title||"";$("contactText").value=c.contact?.text||"";$("contactEmail").value=c.contact?.email||"";
}
function read(){
const services=[...document.querySelectorAll("[data-service-title]")].map((e,i)=>({title:e.value,desc:document.querySelector(`[data-service-desc="${i}"]`).value}));
const projects=[...document.querySelectorAll("[data-project-title]")].map((e,i)=>({title:e.value,desc:document.querySelector(`[data-project-desc="${i}"]`).value,image:document.querySelector(`[data-project-image="${i}"]`).value}));
const pricing=[...document.querySelectorAll("[data-price-name]")].map((e,i)=>({name:e.value,price:document.querySelector(`[data-price-value="${i}"]`).value,desc:document.querySelector(`[data-price-desc="${i}"]`).value}));
return {heroBadge:$("heroBadge").value,heroTitle:$("heroTitle").value,heroText:$("heroText").value,trustText:$("trustText").value,services,projects,pricing,contact:{eyebrow:$("contactEyebrow").value,title:$("contactTitle").value,text:$("contactText").value,email:$("contactEmail").value}};
}
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("loginEmail").value,$("loginPassword").value);$("loginError").textContent=""}catch(e){$("loginError").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);
$("save").onclick=async()=>{try{await setDoc(doc(db,"siteContent","home"),read());$("status").textContent="Changes saved successfully.";$("status").style.display="block";setTimeout(()=>$("status").style.display="none",3000)}catch(e){$("status").textContent="Save failed: "+e.message;$("status").style.display="block"}};
onAuthStateChanged(auth,async user=>{
if(user&&user.email===ADMIN_EMAIL){$("account").textContent="Logged in as "+user.email;$("loginPanel").style.display="none";$("cms").style.display="block";try{const s=await getDoc(doc(db,"siteContent","home"));fill(s.exists()?s.data():defaults)}catch(e){fill(defaults);$("status").textContent="Could not load saved content: "+e.message;$("status").style.display="block"}}
else{$("account").textContent="Please log in";$("cms").style.display="none";$("loginPanel").style.display="block"}
});
</script>
</body>
</html>
