<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelCore Admin</title>
<style>
body{margin:0;background:#f6f7fa;color:#111318;font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:30px 18px}
.card{background:#fff;border:1px solid #e7e9ee;border-radius:20px;padding:24px;margin:16px 0}h1{margin:0 0 8px}h2{font-size:20px}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 7px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfe2e8;border-radius:11px;font:inherit}textarea{min-height:90px}
button{padding:12px 18px;border:0;border-radius:11px;font-weight:800;cursor:pointer}.primary{background:#111318;color:#fff}.light{background:#fff;border:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hidden{display:none}.msg{margin-top:10px;font-weight:700}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>PixelCore Admin</h1><p>Manage your website.</p>
<section id="login" class="card"><h2>Admin Login</h2><label>User ID</label><input id="uid" placeholder="Admin"><label>Password</label><input id="pwd" type="password"><button class="primary" id="loginBtn" style="width:100%;margin-top:16px">Login</button><div id="loginMsg" class="msg"></div></section>
<section id="dash" class="hidden">
<div class="card"><h2>Home</h2><label>Headline</label><input id="headline"><label>Subheadline</label><textarea id="subheadline"></textarea><label>Email</label><input id="email" type="email"><button class="primary" id="homeSave" style="margin-top:16px">Save Home</button><div id="homeMsg" class="msg"></div></div>
<div class="card"><h2>Pricing</h2><div class="grid"><div><label>Basic</label><input id="basic"></div><div><label>Startup</label><input id="startup"></div><div><label>Premium</label><input id="premium"></div></div><button class="primary" id="priceSave" style="margin-top:16px">Save Pricing</button><div id="priceMsg" class="msg"></div></div>
<div class="card"><h2>Image Upload</h2><input id="file" type="file" accept="image/*"><button class="primary" id="upload" style="margin-top:14px">Upload Image</button><input id="url" readonly placeholder="Uploaded image URL" style="margin-top:12px"><div id="uploadMsg" class="msg"></div></div>
<button class="light" id="logout">Logout</button>
</section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://kppwteozuqfbdkfucmni.supabase.co",KEY="sb_publishable_QtbgEnj_zsfR1YsVJH_vzg_Q0pBJQZG",ADMIN="admin@pixelcore.in";
const sb=window.supabase.createClient(URL,KEY),$=x=>document.getElementById(x);
async function load(){let {data}=await sb.from("site_content").select("section,content");if(!data)return;let m=Object.fromEntries(data.map(x=>[x.section,x.content]));let h=m.home||{},p=m.pricing||{};$("headline").value=h.headline||"";$("subheadline").value=h.subheadline||"";$("email").value=h.email||"hello@pixelcore.in";$("basic").value=p.basic?.price||"₹999";$("startup").value=p.startup?.price||"₹2,999";$("premium").value=p.premium?.price||"₹5,999"}
async function auth(){let {data}=await sb.auth.getUser();if(data.user?.email===ADMIN){$("login").classList.add("hidden");$("dash").classList.remove("hidden");load()}else{$("login").classList.remove("hidden");$("dash").classList.add("hidden")}}
$("loginBtn").onclick=async()=>{if($("uid").value.trim()!=="Admin")return $("loginMsg").textContent="User ID should be Admin";let {error}=await sb.auth.signInWithPassword({email:ADMIN,password:$("pwd").value});$("loginMsg").textContent=error?error.message:"Login successful";if(!error)auth()};
$("homeSave").onclick=async()=>{let {error}=await sb.from("site_content").upsert({section:"home",content:{headline:$("headline").value,subheadline:$("subheadline").value,email:$("email").value}},{onConflict:"section"});$("homeMsg").textContent=error?error.message:"Saved ✓"};
$("priceSave").onclick=async()=>{let {error}=await sb.from("site_content").upsert({section:"pricing",content:{basic:{name:"Basic",price:$("basic").value},startup:{name:"Startup",price:$("startup").value},premium:{name:"Premium",price:$("premium").value}}},{onConflict:"section"});$("priceMsg").textContent=error?error.message:"Saved ✓"};
$("upload").onclick=async()=>{let f=$("file").files[0];if(!f)return $("uploadMsg").textContent="Select an image";let path="website/"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"-");let {error}=await sb.storage.from("pixelcore-images").upload(path,f,{contentType:f.type});if(error)return $("uploadMsg").textContent=error.message;let {data}=sb.storage.from("pixelcore-images").getPublicUrl(path);$("url").value=data.publicUrl;$("uploadMsg").textContent="Uploaded ✓"};
$("logout").onclick=async()=>{await sb.auth.signOut();auth()};auth();
</script></body></html>
