<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelCore Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f7fa;
  color:#111318;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:30px 18px
}

h1{margin:0 0 8px}
h2{font-size:20px}

.card{
  background:#fff;
  border:1px solid #e7e9ee;
  border-radius:20px;
  padding:24px;
  margin:16px 0
}

label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin:14px 0 7px
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #dfe2e8;
  border-radius:11px;
  font:inherit
}

textarea{min-height:90px}

button{
  padding:12px 18px;
  border:0;
  border-radius:11px;
  font-weight:800;
  cursor:pointer
}

.primary{
  background:#111318;
  color:#fff
}

.light{
  background:#fff;
  border:1px solid #ddd
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.hidden{display:none}

.msg{
  margin-top:10px;
  font-weight:700
}

@media(max-width:650px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrap">

<h1>PixelCore Admin</h1>
<p>Manage your website.</p>

<!-- LOGIN -->
<section id="login" class="card">

<h2>Admin Login</h2>

<label>User ID</label>
<input id="uid" placeholder="Admin" autocomplete="username">

<label>Password</label>
<input id="pwd" type="password" autocomplete="current-password">

<button
  class="primary"
  id="loginBtn"
  style="width:100%;margin-top:16px">
  Login
</button>

<div id="loginMsg" class="msg"></div>

</section>


<!-- DASHBOARD -->
<section id="dash" class="hidden">

<div class="card">

<h2>Home</h2>

<label>Headline</label>
<input id="headline">

<label>Subheadline</label>
<textarea id="subheadline"></textarea>

<label>Email</label>
<input id="email" type="email">

<button
  class="primary"
  id="homeSave"
  style="margin-top:16px">
  Save Home
</button>

<div id="homeMsg" class="msg"></div>

</div>


<div class="card">

<h2>Pricing</h2>

<div class="grid">

<div>
<label>Basic</label>
<input id="basic">
</div>

<div>
<label>Startup</label>
<input id="startup">
</div>

<div>
<label>Premium</label>
<input id="premium">
</div>

</div>

<button
  class="primary"
  id="priceSave"
  style="margin-top:16px">
  Save Pricing
</button>

<div id="priceMsg" class="msg"></div>

</div>


<div class="card">

<h2>Image Upload</h2>

<input id="file" type="file" accept="image/*">

<button
  class="primary"
  id="upload"
  style="margin-top:14px">
  Upload Image
</button>

<input
  id="url"
  readonly
  placeholder="Uploaded image URL"
  style="margin-top:12px">

<div id="uploadMsg" class="msg"></div>

</div>


<button class="light" id="logout">
Logout
</button>

</section>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://kppwteozuqfbdkfucmni.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QtbgEnj_zsfR1YsVJH_vzg_Q0pBJQZG";

const ADMIN_EMAIL =
"admin@pixelcore.in";


const $ = id =>
document.getElementById(id);

let sb = null;


/* LOGIN MESSAGE */

function showLoginMessage(message){
  $("loginMsg").textContent = message || "";
}


/* SUPABASE INITIALIZATION */

function initSupabase(){

  if(!window.supabase){

    showLoginMessage(
      "Supabase library load కాలేదు. Internet connection check చేయండి."
    );

    return false;
  }

  try{

    sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    return true;

  }catch(e){

    showLoginMessage(
      "Supabase initialization error: " + e.message
    );

    return false;
  }
}


/* LOAD WEBSITE CONTENT */

async function load(){

  if(!sb) return;

  const {data,error} =
    await sb
      .from("site_content")
      .select("section,content");

  if(error){

    console.log("Content load error:",error);

    return;
  }

  const m =
    Object.fromEntries(
      data.map(x => [x.section,x.content])
    );

  const h = m.home || {};
  const p = m.pricing || {};

  $("headline").value =
    h.headline || "";

  $("subheadline").value =
    h.subheadline || "";

  $("email").value =
    h.email || "hello@pixelcore.in";

  $("basic").value =
    p.basic?.price || "₹999";

  $("startup").value =
    p.startup?.price || "₹2,999";

  $("premium").value =
    p.premium?.price || "₹5,999";
}


/* CHECK LOGIN */

async function auth(){

  if(!sb) return;

  const {data,error} =
    await sb.auth.getUser();

  if(error){

    console.log("Auth check:",error);

    $("login").classList.remove("hidden");
    $("dash").classList.add("hidden");

    return;
  }


  if(data.user?.email === ADMIN_EMAIL){

    $("login").classList.add("hidden");

    $("dash").classList.remove("hidden");

    await load();

  }else{

    $("login").classList.remove("hidden");

    $("dash").classList.add("hidden");
  }
}


/* LOGIN BUTTON */

$("loginBtn").onclick = async () => {

  showLoginMessage("");

  const uid =
    $("uid").value.trim();

  const password =
    $("pwd").value;


  if(uid !== "Admin"){

    showLoginMessage(
      "User ID should be Admin"
    );

    return;
  }


  if(!password){

    showLoginMessage(
      "Password enter చేయండి."
    );

    return;
  }


  if(!sb){

    showLoginMessage(
      "Supabase connection ready కాలేదు."
    );

    return;
  }


  $("loginBtn").disabled = true;

  $("loginBtn").textContent =
    "Logging in...";


  try{

    const {data,error} =
      await sb.auth.signInWithPassword({

        email: ADMIN_EMAIL,

        password: password

      });


    if(error){

      showLoginMessage(
        error.message
      );

    }else{

      showLoginMessage(
        "Login successful ✓"
      );

      await auth();
    }
