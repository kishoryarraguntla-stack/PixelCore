<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelCore Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111318;font-family:Arial,sans-serif}
.container{max-width:700px;margin:auto;padding:30px 18px}h1{font-size:38px;margin:0 0 8px}.subtitle{font-size:18px;color:#555;margin-bottom:30px}
.card{background:#fff;border:1px solid #e2e4e8;border-radius:22px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.05)}
h2{margin-top:0;font-size:25px}label{display:block;margin:18px 0 8px;font-weight:700}
input{width:100%;padding:15px;border:1px solid #d9dce2;border-radius:12px;font-size:16px;outline:none}
input:focus{border-color:#111318}button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:12px;background:#111318;color:white;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.message{margin-top:15px;font-weight:700;min-height:22px}.dashboard{display:none}
.logout{background:#fff;color:#111318;border:1px solid #ddd}.box{margin-top:18px;padding:22px;border:1px solid #e2e4e8;border-radius:18px;background:#fff}.error{color:#d00000}
</style>
</head>
<body>
<div class="container">
<h1>PixelCore Admin</h1><div class="subtitle">Manage your website.</div>
<div id="loginCard" class="card">
<h2>Admin Login</h2>
<label>User ID</label><input id="userId" type="text" placeholder="Admin" autocomplete="username">
<label>Password</label><input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
<button id="loginButton" type="button">Login</button><div id="loginMessage" class="message"></div>
</div>
<div id="dashboard" class="dashboard">
<div class="card"><h2>Welcome to PixelCore Admin</h2><p>You are successfully logged in.</p>
<button id="logoutButton" class="logout" type="button">Logout</button></div>
<div class="box"><h3>Website</h3><p>PixelCore.in</p></div>
<div class="box"><h3>Admin Account</h3><p>kishor.yarraguntla@gmail.com</p></div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBTINT8mINL77NOaXz1iiTbbN-bfCiGlg",authDomain:"pixelcore-ecc7e.firebaseapp.com",projectId:"pixelcore-ecc7e"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),ADMIN_EMAIL="kishor.yarraguntla@gmail.com";
const loginCard=document.getElementById("loginCard"),dashboard=document.getElementById("dashboard"),
userId=document.getElementById("userId"),password=document.getElementById("password"),
loginButton=document.getElementById("loginButton"),loginMessage=document.getElementById("loginMessage"),
logoutButton=document.getElementById("logoutButton");
loginButton.addEventListener("click",async function(){
loginMessage.className="message";loginMessage.textContent="";
const uid=userId.value.trim(),pass=password.value;
if(uid!=="Admin"){loginMessage.className="message error";loginMessage.textContent="User ID should be Admin";return}
if(pass===""){loginMessage.className="message error";loginMessage.textContent="Password enter చేయండి.";return}
loginButton.disabled=true;loginButton.textContent="Logging in...";
try{await auth.signInWithEmailAndPassword(ADMIN_EMAIL,pass)}
catch(error){loginMessage.className="message error";loginMessage.textContent=error.message}
finally{loginButton.disabled=false;loginButton.textContent="Login"}
});
auth.onAuthStateChanged(function(user){
if(user&&user.email===ADMIN_EMAIL){loginCard.style.display="none";dashboard.style.display="block"}
else{loginCard.style.display="block";dashboard.style.display="none"}
});
logoutButton.addEventListener("click",async function(){await auth.signOut()});
</script>
</body></html>
